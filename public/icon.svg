<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="12 12" opacity="0.4"/>

  <!-- Roblox Tilted Stud Cube (Iconic Logo) -->
  <g transform="translate(256, 256) rotate(-14) translate(-256, -256)" filter="url(#shadow)">
    <!-- Main Outer Cube -->
    <rect x="136" y="136" width="240" height="240" rx="48" fill="url(#gold)"/>
    <!-- Inner Center Hole -->
    <rect x="216" y="216" width="80" height="80" rx="16" fill="#0369a1"/>
  </g>

  <!-- Cute Sparkles / Stars -->
  <path d="M 390 110 Q 400 135 425 145 Q 400 155 390 180 Q 380 155 355 145 Q 380 135 390 110 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="120" cy="150" r="14" fill="#fde047" opacity="0.85"/>
  <circle cx="410" cy="390" r="10" fill="#fde047" opacity="0.85"/>
</svg>
